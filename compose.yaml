name: sigme

x-app-service: &app-service
    build:
        context: './vendor/laravel/sail/runtimes/8.5'
        dockerfile: Dockerfile
        args:
            WWWGROUP: '${WWWGROUP:-1000}'
            NODE_VERSION: '24'
    image: 'sigme-sail-8.5/app'
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    environment:
        WWWUSER: '${WWWUSER:-1337}'
        SUPERVISOR_PHP_USER: '${SUPERVISOR_PHP_USER:-sail}'
        LARAVEL_SAIL: 1
        XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
        XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
        - '.:/var/www/html'
        - '${SIGME_UPLOAD_DIR:?Execute scripts/wsl/bootstrap.sh primeiro}:/var/www/html/storage/app/private'
        - '${SIGME_LOG_DIR:?Execute scripts/wsl/bootstrap.sh primeiro}:/var/www/html/storage/logs'
    networks:
        - sail
    depends_on:
        mysql:
            condition: service_healthy
        mailpit:
            condition: service_started
    restart: unless-stopped
    init: true

services:
    laravel.test:
        <<: *app-service
        ports:
            - '127.0.0.1:${APP_PORT:-8080}:80'
            - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        healthcheck:
            test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost/up']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s

    queue:
        <<: *app-service
        command:
            - bash
            - '-lc'
            - >-
                until php artisan migrate:status --no-interaction >/dev/null 2>&1;
                do sleep 2; done;
                exec php artisan queue:work
                --sleep=3 --tries=3 --timeout=120 --max-time=3600
        stop_grace_period: 30s

    scheduler:
        <<: *app-service
        command:
            - bash
            - '-lc'
            - >-
                until php artisan migrate:status --no-interaction >/dev/null 2>&1;
                do sleep 2; done;
                exec php artisan schedule:work
        stop_grace_period: 30s

    mysql:
        image: 'mysql:8.4.11'
        command:
            - '--character-set-server=utf8mb4'
            - '--collation-server=utf8mb4_unicode_ci'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?Execute scripts/wsl/bootstrap.sh primeiro}'
            MYSQL_DATABASE: '${DB_DATABASE:-sigme}'
            MYSQL_USER: '${DB_USERNAME:-sigme}'
            MYSQL_PASSWORD: '${DB_PASSWORD:?Execute scripts/wsl/bootstrap.sh primeiro}'
            MYSQL_TEST_DATABASE: '${DB_TEST_DATABASE:-sigme_testing}'
        volumes:
            - 'sigme_mysql_data:/var/lib/mysql'
            - './docker/mysql/init/10-create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh:ro'
        networks:
            - sail
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping --host=127.0.0.1 --user=root --silent']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s

    mailpit:
        image: 'axllent/mailpit:v1.30.6'
        ports:
            - '127.0.0.1:${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
        restart: unless-stopped

networks:
    sail:
        driver: bridge

volumes:
    sigme_mysql_data:
        name: sigme_mysql_data
        driver: local
