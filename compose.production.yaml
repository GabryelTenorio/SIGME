name: '${SIGME_PRODUCTION_PROJECT:-sigme-production}'

x-app: &app
    image: '${SIGME_PRODUCTION_PROJECT:-sigme-production}-app:release'
    build:
        context: .
        dockerfile: docker/windows/Dockerfile
    environment:
        APP_NAME: '${APP_NAME:-SIGME}'
        APP_ENV: production
        APP_DEBUG: 'false'
        APP_KEY: '${APP_KEY:?Defina APP_KEY em .env.production}'
        APP_URL: '${APP_URL:?Defina APP_URL em .env.production}'
        TRUSTED_PROXIES: '${TRUSTED_PROXIES:-*}'
        APP_LOCALE: '${APP_LOCALE:-pt_BR}'
        APP_FALLBACK_LOCALE: '${APP_FALLBACK_LOCALE:-pt_BR}'
        APP_TIMEZONE: '${APP_TIMEZONE:-America/Sao_Paulo}'
        BCRYPT_ROUNDS: '${BCRYPT_ROUNDS:-12}'
        DB_CONNECTION: mysql
        DB_HOST: mysql
        DB_PORT: 3306
        DB_DATABASE: '${DB_DATABASE:-sigme}'
        DB_USERNAME: '${DB_USERNAME:-sigme}'
        DB_PASSWORD: '${DB_PASSWORD:?Defina DB_PASSWORD em .env.production}'
        SESSION_DRIVER: database
        SESSION_LIFETIME: '${SESSION_LIFETIME:-120}'
        SESSION_ENCRYPT: 'true'
        SESSION_COOKIE: '${SIGME_PRODUCTION_PROJECT:-sigme-production}-session'
        SESSION_PATH: '/'
        SESSION_DOMAIN: '${SESSION_DOMAIN:-null}'
        SESSION_SECURE_COOKIE: 'true'
        SESSION_HTTP_ONLY: 'true'
        SESSION_SAME_SITE: lax
        CACHE_STORE: database
        FILESYSTEM_DISK: private-local
        QUEUE_CONNECTION: database
        MAIL_MAILER: '${MAIL_MAILER:-smtp}'
        MAIL_SCHEME: '${MAIL_SCHEME:-smtp}'
        MAIL_HOST: '${MAIL_HOST:?Defina MAIL_HOST em .env.production}'
        MAIL_PORT: '${MAIL_PORT:-587}'
        MAIL_USERNAME: '${MAIL_USERNAME:?Defina MAIL_USERNAME em .env.production}'
        MAIL_PASSWORD: '${MAIL_PASSWORD:?Defina MAIL_PASSWORD em .env.production}'
        MAIL_EHLO_DOMAIN: '${MAIL_EHLO_DOMAIN:?Defina MAIL_EHLO_DOMAIN em .env.production}'
        MAIL_FROM_ADDRESS: '${MAIL_FROM_ADDRESS:?Defina MAIL_FROM_ADDRESS em .env.production}'
        MAIL_FROM_NAME: '${MAIL_FROM_NAME:-SIGME}'
        TWO_FACTOR_ENFORCE_PRIVILEGED: 'true'
        TWO_FACTOR_REQUIRED_ROLES: '${TWO_FACTOR_REQUIRED_ROLES:-administrador-rede,administrador-escola,gestor}'
        LOG_CHANNEL: stack
        LOG_LEVEL: '${LOG_LEVEL:-warning}'
    volumes:
        - uploads:/var/www/html/storage/app/private
        - logs:/var/www/html/storage/logs
    depends_on:
        mysql:
            condition: service_healthy
    restart: unless-stopped
    init: true

services:
    app:
        <<: *app
        ports:
            - '127.0.0.1:${APP_PORT:-8080}:8080'
        healthcheck:
            test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/up']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 15s
    queue:
        <<: *app
        command: ['php', 'artisan', 'queue:work', '--sleep=3', '--tries=3', '--timeout=120', '--max-time=3600']
        stop_grace_period: 130s
    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
    mysql:
        image: mysql:8.4.11
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD em .env.production}'
            MYSQL_DATABASE: '${DB_DATABASE:-sigme}'
            MYSQL_USER: '${DB_USERNAME:-sigme}'
            MYSQL_PASSWORD: '${DB_PASSWORD:?Defina DB_PASSWORD em .env.production}'
        volumes:
            - mysql:/var/lib/mysql
        healthcheck:
            test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h127.0.0.1 -uroot --silent']
            interval: 5s
            timeout: 5s
            retries: 40
            start_period: 30s
        restart: unless-stopped

volumes:
    mysql:
    uploads:
    logs:
