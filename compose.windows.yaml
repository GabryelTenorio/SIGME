name: sigme-windows

x-app: &app
    image: '${SIGME_WINDOWS_PROJECT:-sigme-windows}-app:local'
    build:
        context: .
        dockerfile: docker/windows/Dockerfile
    environment:
        APP_NAME: SIGME
        APP_ENV: '${APP_ENV:-local}'
        APP_DEBUG: '${APP_DEBUG:-false}'
        APP_KEY: '${APP_KEY:?Execute Instalar SIGME Docker.cmd}'
        APP_URL: 'http://localhost:${APP_PORT:-8080}'
        APP_LOCALE: pt_BR
        APP_FALLBACK_LOCALE: pt_BR
        APP_TIMEZONE: America/Sao_Paulo
        DB_CONNECTION: mysql
        DB_HOST: mysql
        DB_DATABASE: '${DB_DATABASE:-sigme}'
        DB_USERNAME: sigme
        DB_PASSWORD: '${DB_PASSWORD:?Execute Instalar SIGME Docker.cmd}'
        SESSION_DRIVER: database
        SESSION_LIFETIME: '${SESSION_LIFETIME:-120}'
        SESSION_ENCRYPT: 'true'
        SESSION_COOKIE: '${SIGME_WINDOWS_PROJECT:-sigme-windows}-session'
        SESSION_SECURE_COOKIE: '${SESSION_SECURE_COOKIE:-false}'
        SESSION_HTTP_ONLY: 'true'
        SESSION_SAME_SITE: lax
        CACHE_STORE: database
        FILESYSTEM_DISK: private-local
        QUEUE_CONNECTION: database
        MAIL_MAILER: '${MAIL_MAILER:-smtp}'
        MAIL_SCHEME: '${MAIL_SCHEME:-null}'
        MAIL_HOST: '${MAIL_HOST:-mailpit}'
        MAIL_PORT: '${MAIL_PORT:-1025}'
        MAIL_USERNAME: '${MAIL_USERNAME:-null}'
        MAIL_PASSWORD: '${MAIL_PASSWORD:-null}'
        MAIL_EHLO_DOMAIN: '${MAIL_EHLO_DOMAIN:-localhost}'
        MAIL_FROM_ADDRESS: '${MAIL_FROM_ADDRESS:-sigme@example.test}'
        MAIL_FROM_NAME: '${MAIL_FROM_NAME:-SIGME}'
        TWO_FACTOR_ENFORCE_PRIVILEGED: '${TWO_FACTOR_ENFORCE_PRIVILEGED:-true}'
        TWO_FACTOR_REQUIRED_ROLES: '${TWO_FACTOR_REQUIRED_ROLES:-administrador-rede,administrador-escola,gestor}'
        LOG_CHANNEL: stack
    volumes:
        - uploads:/var/www/html/storage/app/private
        - logs:/var/www/html/storage/logs
    depends_on:
        mysql:
            condition: service_healthy
        mailpit:
            condition: service_started
    restart: unless-stopped
    init: true

services:
    app:
        <<: *app
        ports:
            - '127.0.0.1:${APP_PORT:-8080}:8080'
        healthcheck:
            test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/up']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 15s
    queue:
        <<: *app
        command: ['php', 'artisan', 'queue:work', '--sleep=3', '--tries=3', '--timeout=120', '--max-time=3600']
        stop_grace_period: 130s
    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
    mysql:
        image: mysql:8.4.11
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?Execute Instalar SIGME Docker.cmd}'
            MYSQL_DATABASE: '${DB_DATABASE:-sigme}'
            MYSQL_USER: sigme
            MYSQL_PASSWORD: '${DB_PASSWORD:?Execute Instalar SIGME Docker.cmd}'
        volumes:
            - mysql:/var/lib/mysql
        healthcheck:
            test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h127.0.0.1 -uroot --silent']
            interval: 5s
            timeout: 5s
            retries: 40
            start_period: 30s
        restart: unless-stopped
    mailpit:
        image: axllent/mailpit:v1.30.6
        ports:
            - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
        restart: unless-stopped

volumes:
    mysql:
    uploads:
    logs:
